name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  PYTHON_VERSION: "3.13"
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3"

      - name: Install dependencies
        run: task init

      - name: Format, lint, and type-check
        run: task format

      - name: Fail if formatting changed files
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3"

      - name: Install dependencies
        run: task init
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Install Chromium for the dashboard tests
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        shell: bash  # with pipefail, so tee does not hide a failing exit status
        run: task test 2>&1 | tee test.log

      # The step log is only readable when signed in; annotations are visible to everyone (and
      # through the API), so surface what failed. GitHub shows at most 10 per level and step.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " test.log | head -10 | while IFS= read -r l; do echo "::error title=pytest::${l:0:900}"; done
          grep -E "^E  " test.log | head -10 | while IFS= read -r l; do echo "::warning title=pytest assertion::${l:0:900}"; done

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.13'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
