version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  init:
    desc: Install dependencies and create the virtual environment
    cmds:
      - uv sync
      - echo "Created virtual environment"

  train:
    desc: "Train the TQC policy; pass args with: task train -- --steps 300000"
    cmds:
      - uv run python scripts/train.py {{.CLI_ARGS}}

  play:
    desc: "Run a trained policy and open an interactive HTML replay; args: task play -- --checkpoint checkpoints/double/tqc/tqc_latest.pt"
    cmds:
      - uv run python scripts/play.py {{.CLI_ARGS}}

  eval-transitions:
    desc: "Success matrix of a goal-conditioned policy over every start→goal transition; args: task eval-transitions -- --checkpoint checkpoints/double/tqc-goal/tqc_latest.pt"
    cmds:
      - uv run python scripts/eval_transitions.py {{.CLI_ARGS}}

  eval-swingup:
    desc: "Time a swing-up policy from randomized low-energy near-hanging starts; args: task eval-swingup -- --checkpoint checkpoints/double/tqc/tqc_latest.pt --trials 10"
    cmds:
      - uv run python scripts/eval_swingup.py {{.CLI_ARGS}}

  export-web:
    desc: "Export the goal-conditioned (default) or swing-up actor + physics for the personal site's browser demo; args: task export-web -- --checkpoint checkpoints/double/tqc-goal/tqc_latest.pt --out-dir ../personal-site/assets/models"
    cmds:
      - uv run python scripts/export_web.py {{.CLI_ARGS}}

  package-models:
    desc: "Zip locally trained checkpoints/<links>/<algo>/ into dist/*.zip"
    cmds:
      - |
        set -e
        mkdir -p dist
        rm -f dist/*.zip
        for links in single double; do
          for algo in tqc tqc-goal; do
            dir="checkpoints/$links/$algo"
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              (cd checkpoints && zip -rq "../dist/${links}-${algo}.zip" "$links/$algo")
              echo "packaged dist/${links}-${algo}.zip"
            fi
          done
        done
        if [ -z "$(ls -A dist/*.zip 2>/dev/null)" ]; then
          echo "No checkpoints found under checkpoints/<single|double>/<tqc|tqc-goal>/ — train first." >&2
          exit 1
        fi

  release-models:
    desc: "Package local checkpoints, tag, and publish as a GitHub Release; args: task release-models -- models-v1"
    cmds:
      - task: package-models
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
      - gh release create {{.CLI_ARGS}} dist/*.zip --repo Tsmorz/n-cartpole --generate-notes

  download-models:
    desc: "Download a models release from GitHub into checkpoints/; args: task download-models -- models-v1"
    cmds:
      - gh release download {{.CLI_ARGS}} --repo Tsmorz/n-cartpole --dir checkpoints --clobber --pattern "*.zip"
      - for f in checkpoints/*.zip; do unzip -o "$f" -d checkpoints && rm "$f"; done

  sysid:
    desc: "Fit the plant parameters to device recordings (.ncpr); args: task sysid -- recordings/*.ncpr --config config/rig.toml --out config/rig-fitted.toml"
    cmds:
      - uv run python scripts/sysid.py {{.CLI_ARGS}}

  distill:
    desc: "Distill a policy for the firmware; args: task distill -- --help"
    cmds:
      - uv run python scripts/distill.py {{.CLI_ARGS}}

  export-firmware:
    desc: "Export a checkpoint as a firmware model blob (.ncpm); args: task export-firmware -- --checkpoint checkpoints/double/tqc-goal/tqc_latest.pt"
    cmds:
      - uv run python scripts/export_firmware.py {{.CLI_ARGS}}

  fw-build:
    desc: "Build the ESP32-S3 firmware in the ESP-IDF v5.3.1 Docker image -> firmware/build/{n_cartpole_fw,factory}.bin"
    cmds:
      - >-
        docker run --rm -v "$PWD/firmware:/project" -w /project espressif/idf:v5.3.1
        sh -c 'idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o factory.bin @flash_args'

  fw-flash:
    desc: "Flash a merged factory image over USB, keeping the saved Wi-Fi network (NVS); args: task fw-flash -- <port> [image] [--erase-settings] (default firmware/build/factory.bin)"
    cmds:
      - uv run python firmware/tools/flash.py {{.CLI_ARGS}}

  fw-flash-model:
    desc: "Write a model blob (.ncpm) to the model partition (0x620000) over USB; args: task fw-flash-model -- <port> <model.ncpm>"
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ $# -lt 2 ]; then echo "usage: task fw-flash-model -- <port> <model.ncpm>" >&2; exit 1; fi
        uvx esptool --chip esp32s3 -p "$1" -b 921600 write_flash 0x620000 "$2"

  fw-monitor:
    desc: "Serial console of the device (115200 baud); args: task fw-monitor -- <port>"
    vars:
      PORT: '{{.PORT | default ""}}'
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        port="${1:-{{.PORT}}}"
        if [ -z "$port" ]; then echo "usage: task fw-monitor -- <port>" >&2; exit 1; fi
        uvx --from pyserial pyserial-miniterm "$port" 115200

  fw-mock:
    desc: "Run a stand-in device (same HTTP/WS API, simulated plant) to develop the dashboard; args: task fw-mock -- --help"
    cmds:
      - uv run python firmware/tools/mock_device.py {{.CLI_ARGS}}

  fw-release:
    desc: "Tag and push a firmware release (the firmware workflow builds and publishes it); args: task fw-release -- fw-v0.2.0"
    cmds:
      - git tag {{.CLI_ARGS}} && git push origin {{.CLI_ARGS}}

  fw-download:
    desc: "Download a firmware release into dist/firmware/; args: task fw-download -- fw-v0.2.0"
    cmds:
      - gh release download {{.CLI_ARGS}} --repo Tsmorz/n-cartpole --pattern 'n-cartpole-fw-*' --pattern SHA256SUMS --dir dist/firmware --clobber

  plot:
    desc: "Render the interactive training dashboard from checkpoints/metrics.csv"
    cmds:
      - uv run python scripts/plot_returns.py {{.CLI_ARGS}}

  test:
    desc: Run the test suite with coverage
    cmds:
      - uv run pytest {{.PYTEST_FLAGS}} --cov=n_cartpole/ --cov-report=term-missing --cov-report=lcov:coverage.lcov --no-cov-on-fail --cov-fail-under=90

  format:
    desc: Format, lint, and type-check the code
    cmds:
      - uv run ruff format {{.RUFF_FLAGS}}
      - uv run ruff check --fix {{.RUFF_FLAGS}}
      - uv run mypy n_cartpole/ tests/ scripts/ --ignore-missing-imports {{.MYPY_FLAGS}}

  ci:
    desc: Run the full CI suite locally (format + test), bypassing tool caches like a fresh CI runner
    cmds:
      # A stale .mypy_cache once hid a type error that failed on GitHub, so
      # nothing here reads ruff/mypy/pytest caches.
      - task: format
        vars:
          RUFF_FLAGS: --no-cache
          MYPY_FLAGS: --no-incremental --cache-dir=/dev/null
      - task: test
        vars:
          PYTEST_FLAGS: -p no:cacheprovider

  clean:
    desc: Remove the virtual environment, caches, build artifacts, and checkpoints
    cmds:
      - rm -rf .venv
      - rm -rf .mypy_cache
      - rm -rf .pytest_cache
      - rm -rf .ruff_cache
      - rm -rf build/
      - rm -rf dist/
      - find . -name ".coverage*" -delete
      - find . -name "__pycache__" -exec rm -r {} +
