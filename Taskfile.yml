version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  init:
    desc: Install dependencies (uv sync)
    cmds:
      - uv sync
      - echo "Created virtual environment"

  train:
    desc: "Train the TQC policy; args: -- --steps 300000"
    cmds:
      - uv run python scripts/train.py {{.CLI_ARGS}}

  play:
    desc: "Interactive HTML replay; args: -- --help"
    cmds:
      - uv run python scripts/play.py {{.CLI_ARGS}}

  eval-transitions:
    desc: "Start→goal success matrix; args: -- --help"
    cmds:
      - uv run python scripts/eval_transitions.py {{.CLI_ARGS}}

  eval-swingup:
    desc: "Time swing-ups from near-hanging; args: -- --help"
    cmds:
      - uv run python scripts/eval_swingup.py {{.CLI_ARGS}}

  export-web:
    desc: "Export actor for the site demo; args: -- --help"
    cmds:
      - uv run python scripts/export_web.py {{.CLI_ARGS}}

  package-models:
    desc: "Zip checkpoints/<links>/<algo>/ into dist/*.zip"
    cmds:
      - |
        set -e
        mkdir -p dist
        rm -f dist/*.zip
        for links in single double; do
          for algo in tqc tqc-goal; do
            dir="checkpoints/$links/$algo"
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              (cd checkpoints && zip -rq "../dist/${links}-${algo}.zip" "$links/$algo")
              echo "packaged dist/${links}-${algo}.zip"
            fi
          done
        done
        if [ -z "$(ls -A dist/*.zip 2>/dev/null)" ]; then
          echo "No checkpoints found under checkpoints/<single|double>/<tqc|tqc-goal>/ — train first." >&2
          exit 1
        fi

  release-models:
    desc: "Package, tag, publish models; args: -- models-v1"
    cmds:
      - task: package-models
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
      - gh release create {{.CLI_ARGS}} dist/*.zip --repo Tsmorz/n-cartpole --generate-notes

  download-models:
    desc: "Download a models release; args: -- models-v1"
    cmds:
      - gh release download {{.CLI_ARGS}} --repo Tsmorz/n-cartpole --dir checkpoints --clobber --pattern "*.zip"
      - for f in checkpoints/*.zip; do unzip -o "$f" -d checkpoints && rm "$f"; done

  sysid:
    desc: "Fit the plant to device recordings; args: -- --help"
    cmds:
      - uv run python scripts/sysid.py {{.CLI_ARGS}}

  distill:
    desc: "Distill a policy for the firmware; args: -- --help"
    cmds:
      - uv run python scripts/distill.py {{.CLI_ARGS}}

  export-firmware:
    desc: "Export a checkpoint as .ncpm; args: -- --help"
    cmds:
      - uv run python scripts/export_firmware.py {{.CLI_ARGS}}

  fw-build:
    desc: "Build the firmware in Docker -> firmware/build/"
    cmds:
      - >-
        docker run --rm -v "$PWD/firmware:/project" -w /project espressif/idf:v5.3.1
        sh -c 'idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o factory.bin @flash_args'

  fw-build-rig:
    desc: "Build the rig backend in Docker -> firmware/build-rig/"
    cmds:
      - >-
        docker run --rm -v "$PWD/firmware:/project" -w /project espressif/idf:v5.3.1
        sh -c 'idf.py -B build-rig -D SDKCONFIG=build-rig/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.rig" build && cd build-rig && esptool.py --chip esp32s3 merge_bin -o factory.bin @flash_args'

  fw-flash:
    desc: "Flash a factory image; args: -- <port> [image]"
    cmds:
      - uv run python firmware/tools/flash.py {{.CLI_ARGS}}

  fw-flash-model:
    desc: "Write a .ncpm over USB; args: -- <port> <file>"
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ $# -lt 2 ]; then echo "usage: task fw-flash-model -- <port> <model.ncpm>" >&2; exit 1; fi
        uvx esptool --chip esp32s3 -p "$1" -b 921600 write_flash 0x620000 "$2"

  fw-monitor:
    desc: "Serial console (115200 baud); args: -- <port>"
    vars:
      PORT: '{{.PORT | default ""}}'
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        port="${1:-{{.PORT}}}"
        if [ -z "$port" ]; then echo "usage: task fw-monitor -- <port>" >&2; exit 1; fi
        uvx --from pyserial pyserial-miniterm "$port" 115200

  fw-mock:
    desc: "Simulated device for the dashboard; args: -- --help"
    cmds:
      - uv run python firmware/tools/mock_device.py {{.CLI_ARGS}}

  fw-release:
    desc: "Tag and push a firmware release; args: -- fw-v0.2.0"
    cmds:
      - git tag {{.CLI_ARGS}} && git push origin {{.CLI_ARGS}}

  fw-installer:
    desc: "Write installer files to the site; args: -- fw-v0.1.0"
    cmds:
      - uv run python firmware/tools/web_install.py {{.CLI_ARGS}}

  fw-publish:
    desc: "Copy the dashboard into the personal site"
    # Copies firmware/web/ to <site>/controls/swingup/real/dashboard/. Review, commit and push
    # there yourself. PERSONAL_SITE changes the checkout path (default ../personal-site).
    vars:
      SITE: '{{.PERSONAL_SITE | default "../personal-site"}}'
    cmds:
      - uv run pytest tests/test_dashboard.py tests/test_api_schema.py -q --no-cov
      - |
        set -e
        SITE="{{.SITE}}"
        if [ ! -f "$SITE/_config.yml" ]; then
          echo "No personal-site checkout at $SITE (set PERSONAL_SITE)." >&2
          exit 1
        fi
        # What goes public should be a commit, so the site's history can name the one it came from.
        if [ -n "$(git status --porcelain -- firmware/web)" ]; then
          echo "firmware/web has uncommitted changes; commit them first." >&2
          exit 1
        fi
        # --delete drops files removed here: dashboard/ is owned entirely by this task.
        mkdir -p "$SITE/controls/swingup/real/dashboard"
        rsync -a --delete --exclude='.*' firmware/web/ "$SITE/controls/swingup/real/dashboard/"
        echo "Copied firmware/web at $(git rev-parse --short HEAD) to $SITE/controls/swingup/real/dashboard/:"
        git -C "$SITE" status --short -- controls/swingup/real/dashboard
        echo "Review it there, then commit, e.g.: git commit -m 'dashboard: n-cartpole $(git rev-parse --short HEAD)'"

  fw-download:
    desc: "Download a firmware release; args: -- fw-v0.2.0"
    cmds:
      - gh release download {{.CLI_ARGS}} --repo Tsmorz/n-cartpole --pattern 'n-cartpole-fw-*' --pattern SHA256SUMS --dir dist/firmware --clobber

  test:
    desc: Run the test suite with coverage
    cmds:
      - uv run pytest {{.PYTEST_FLAGS}} --cov=n_cartpole/ --cov-report=term-missing --cov-report=lcov:coverage.lcov --no-cov-on-fail --cov-fail-under=90

  format:
    desc: Format, lint, and type-check the code
    cmds:
      - uv run ruff format {{.RUFF_FLAGS}}
      - uv run ruff check --fix {{.RUFF_FLAGS}}
      - uv run mypy n_cartpole/ tests/ scripts/ firmware/tools/ --ignore-missing-imports {{.MYPY_FLAGS}}

  ci:
    desc: "Run format + test locally, bypassing tool caches"
    cmds:
      # A stale .mypy_cache once hid a type error that failed on GitHub, so
      # nothing here reads ruff/mypy/pytest caches.
      - task: format
        vars:
          RUFF_FLAGS: --no-cache
          MYPY_FLAGS: --no-incremental --cache-dir=/dev/null
      - task: test
        vars:
          PYTEST_FLAGS: -p no:cacheprovider

  clean:
    desc: "Remove venv, caches, build artifacts, checkpoints"
    cmds:
      - rm -rf .venv
      - rm -rf .mypy_cache
      - rm -rf .pytest_cache
      - rm -rf .ruff_cache
      - rm -rf build/
      - rm -rf dist/
      - find . -name ".coverage*" -delete
      - find . -name "__pycache__" -exec rm -r {} +
