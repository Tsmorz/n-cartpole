# Default configuration for n-cartpole training and deployment.
#
# This is the single source of truth for all physical parameters, environment
# settings, and training hyperparameters.  Edit here; do not scatter defaults
# across Python files.
#
# Load in Python:
#   from n_cartpole.config import load_tqc_config
#   tqc_cfg = load_tqc_config("config/default.toml")
#
# Pass to the CLI:
#   task train -- --config config/default.toml


# =============================================================================
# Physics — simulation model parameters
# =============================================================================
# These define the simulated plant.  They are the "true" params the dynamics
# engine uses.  For pure simulation training they are also the nominal values
# shown to the network (with noise) via the sysID context.
[physics]
M            = 1.00     # cart mass (kg)
g            = 9.81     # gravitational acceleration (m/s²)
dt           = 0.01     # control timestep (s) — must match your loop rate
force_max    = 20.0     # actuator force limit (N)
x_lim        = 0.50     # rail half-length (m)
b            = 0.10     # cart viscous friction (N·s/m)
masses       = [0.20, 0.15]   # bob masses per link (kg); scalar = shared
lengths      = 0.25           # rod lengths per link (m); scalar = shared
joint_friction = 0.002        # joint friction per link (N·m·s/rad); scalar = shared


# =============================================================================
# Environment
# =============================================================================
[env]
n_links          = 2       # pendulum link count (1 = single, 2 = double, …)
max_steps        = 1000    # episode length limit (steps)
init_noise       = 0.05    # perturbation around hanging-down start (rad / m)
init_random_prob = 0.30    # fraction of resets that use a fully random state
init_vel_noise   = 2.0     # velocity range for random resets (rad/s, m/s)

# Goal-conditioned transitions between equilibria (UU, DU, UD, DD for 2 links).
# When true the target configuration is part of the observation, episodes start
# at any equilibrium, and the goal is re-drawn every goal_hold_steps steps.
# Raise max_steps (e.g. 3000) so each episode covers several transitions.
goal_conditioned = false
goal_hold_steps  = [400, 800]  # steps each goal is held before a new one (4–8 s)
goal_curriculum  = true        # oversample transitions that still fail


# =============================================================================
# Hardware — real rig parameters (comment out entire section to disable sysID)
# =============================================================================
# When this section is present, the env appends a sysID context vector to
# every observation and models action latency + sensor noise.  The context is
# the measured nominal params below, perturbed by the noise stds each episode.
#
# Measurement guidance:
#   M, masses  : bench scale (±1 g → noise ≈ 0.001)
#   lengths    : steel ruler (±0.5 mm → noise ≈ 0.0005)
#   b          : free-deceleration fit (rough ±30 %)
#   friction   : free-oscillation decay fit (rough ±30 %)
#   delay_steps: measure your control loop round-trip; ESP32 USB/UART at 100 Hz
#                is typically 1–2 steps (10–20 ms)
[hardware.physics]
M              = 1.00
g              = 9.81
dt             = 0.01
force_max      = 20.0
x_lim          = 0.50
b              = 0.10
masses         = [0.20, 0.15]
lengths        = 0.25
joint_friction = 0.002

[hardware.noise]
M_noise              = 0.050    # cart mass (kg)
b_noise              = 0.030    # cart viscous friction (N·s/m)
masses_noise         = 0.005    # per-link bob mass (kg)
lengths_noise        = 0.005    # per-link rod length (m)
joint_friction_noise = 0.0005   # per-link joint friction (N·m·s/rad)

[hardware.pipeline]
delay_steps      = 1      # steps between command and actuation (1 step = 10 ms)
sensor_noise_std = 0.0    # Gaussian std added to each obs dim (set > 0 for noisy sensors)


# =============================================================================
# TQC training
# =============================================================================
[tqc]
device    = "auto"
hidden    = 256
blocks    = 2
n_critics = 2
n_quantiles           = 25
top_quantiles_to_drop = 2

gamma            = 0.99
tau              = 0.005   # soft target update rate
lr               = 3e-4
batch_size       = 256
buffer_size      = 1_000_000
start_steps      = 5_000
updates_per_step = 1
symmetry_augment = true

total_steps      = 200_000
checkpoint_every = 25_000
log_every        = 5_000
